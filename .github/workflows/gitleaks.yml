# gitleaks secret scanning CI
# - runs on pull_request and on push to the default branch
# - scans only new commits (PR base..head, or push before..after);
#   first push / all-zero before SHA scans just the head commit
# - actions/checkout pinned by full commit SHA (v4.4.0)
# - gitleaks official release binary pinned by version + sha256
# - permissions: contents: read only; no repository secrets required
# - default runs-on is ubuntu-latest; repos that already use NAS self-hosted
#   ephemeral runners should set runs-on: [self-hosted, linux, x64, nas-ephemeral]
name: gitleaks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          ARCHIVE="gitleaks_${VER}_linux_x64.tar.gz"
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "/tmp/${ARCHIVE}" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${ARCHIVE}"
          echo "${SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          chmod 0755 /tmp/gitleaks
          /tmp/gitleaks version

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          is_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if ! is_sha "${PR_BASE}" || ! is_sha "${PR_HEAD}"; then
              echo "refusing to scan: missing or invalid PR base/head SHA" >&2
              exit 2
            fi
            LOG_OPTS="${PR_BASE}..${PR_HEAD}"
          elif [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "${ZERO}" ]; then
            if ! is_sha "${PUSH_AFTER}"; then
              echo "refusing to scan: missing or invalid push after SHA" >&2
              exit 2
            fi
            LOG_OPTS="-1 ${PUSH_AFTER}"
          else
            if ! is_sha "${PUSH_BEFORE}" || ! is_sha "${PUSH_AFTER}"; then
              echo "refusing to scan: missing or invalid push before/after SHA" >&2
              exit 2
            fi
            LOG_OPTS="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          /tmp/gitleaks detect --redact --no-banner --source "${GITHUB_WORKSPACE}" --log-opts="${LOG_OPTS}"
