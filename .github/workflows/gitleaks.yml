# gitleaks secret scanning CI
# - runs on pull_request and on push to the default branch
# - actions/checkout pinned by full commit SHA (v7.0.1)
# - gitleaks official release binary pinned by version + sha256
# - permissions: contents: read only; no repository secrets required
name: gitleaks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          ARCHIVE="gitleaks_${VER}_linux_x64.tar.gz"
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "/tmp/${ARCHIVE}" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${ARCHIVE}"
          echo "${SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          chmod 0755 /tmp/gitleaks
          /tmp/gitleaks version

      - name: Run gitleaks
        run: /tmp/gitleaks detect --redact --no-banner --source "${GITHUB_WORKSPACE}"
